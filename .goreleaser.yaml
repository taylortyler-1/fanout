version: 2
project_name: fanout

before:
  hooks:
    - sh scripts/completions.sh

builds:
  - main: ./cmd/fanout
    binary: fanout
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/taylortyler-1/fanout/internal/cli.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

homebrew_casks:
  - name: fanout
    description: Build Claude Code plugins and Pi packages from Agent Skills
    homepage: https://github.com/taylortyler-1/fanout
    license: MIT
    repository:
      owner: taylortyler-1
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: Taylor Tyler
      email: taylortyler-1@pm.me
    completions:
      bash: completions/fanout.bash
      zsh: completions/fanout.zsh
      fish: completions/fanout.fish
    # The binaries are not notarized, so clear the quarantine flag that would
    # otherwise make Gatekeeper block the first run.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/fanout"]
          end
